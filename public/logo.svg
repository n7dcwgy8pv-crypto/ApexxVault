<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gavelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Planetary Orbit Ring -->
  <ellipse cx="50" cy="50" rx="40" ry="16" transform="rotate(-25 50 50)" stroke="url(#orbitGrad)" stroke-width="3" stroke-dasharray="8 4" opacity="0.8"/>
  
  <!-- Gavel Head & Handle -->
  <g filter="url(#glow)">
    <!-- Gavel Head -->
    <rect x="36" y="24" width="28" height="14" rx="4" transform="rotate(35 50 31)" fill="url(#gavelGrad)" stroke="#FDE68A" stroke-width="1.5"/>
    <rect x="33" y="22" width="6" height="18" rx="2" transform="rotate(35 36 31)" fill="#B45309"/>
    <rect x="61" y="22" width="6" height="18" rx="2" transform="rotate(35 64 31)" fill="#B45309"/>
    <!-- Handle -->
    <rect x="47" y="34" width="6" height="38" rx="3" transform="rotate(35 50 53)" fill="#FDE68A" stroke="#B45309" stroke-width="1"/>
    <!-- Sound Block -->
    <ellipse cx="62" cy="74" rx="14" ry="6" fill="#334155" stroke="#64748B" stroke-width="1.5"/>
    <!-- Sparkles / Stars -->
    <polygon points="78,22 80,27 85,29 80,31 78,36 76,31 71,29 76,27" fill="#FDE68A"/>
    <polygon points="22,66 23,69 26,70 23,71 22,74 21,71 18,70 21,69" fill="#38BDF8"/>
  </g>
</svg>
